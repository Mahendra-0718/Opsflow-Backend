spring.application.name=opsflow-backend
server.port=${PORT:8080}

# Aiven PostgreSQL connection (set these environment variables locally or on your host)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema changes; Hibernate validates entities against the migrated schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Keep security logs quiet in deployed environments.
logging.level.org.springframework.security=WARN
